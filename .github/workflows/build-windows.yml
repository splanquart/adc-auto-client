name: Build Windows EXE

# Déclencheurs :
#   - push d'un tag v*  → build + publication d'une Release GitHub avec l'exe
#   - workflow_dispatch → build manuel (bouton "Run workflow" dans l'onglet Actions)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pyserial pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name AdcAutoClient `
            --hidden-import serial.tools.list_ports_windows `
            src/main.py

      - name: Verify artifact
        run: Get-ChildItem dist

      - name: Upload artifact (builds manuels)
        uses: actions/upload-artifact@v4
        with:
          name: AdcAutoClient-windows
          path: dist/AdcAutoClient.exe

      - name: Create GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AdcAutoClient.exe
          generate_release_notes: true
